{{define "viewer"}}
<!DOCTYPE html>
<html lang="{{.Language}}" dir="{{.Direction}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.MetaTitle}}</title>
    <link rel="icon" href="{{.FaviconURL}}">
    <meta name="description" content="{{.MetaDesc}}">
    {{if .NoIndex}}<meta name="robots" content="noindex,nofollow,noarchive">{{end}}
    <link rel="canonical" href="{{.CanonicalURL}}">
    <link rel="alternate" type="application/json+oembed" href="{{.OEmbedURL}}" title="{{.MetaTitle}}">
    <meta property="og:title" content="{{.SocialTitle}}">
    <meta property="og:description" content="{{.SocialDesc}}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{.CanonicalURL}}">
    <meta property="og:site_name" content="{{.Workspace.Name}}">
    {{if .OGImage}}<meta property="og:image" content="{{.OGImage}}">
    <meta property="og:image:width" content="{{.Flipbook.PageWidth}}">
    <meta property="og:image:height" content="{{.Flipbook.PageHeight}}">{{end}}
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{.SocialTitle}}">
    <meta name="twitter:description" content="{{.SocialDesc}}">
    {{if .OGImage}}<meta name="twitter:image" content="{{.OGImage}}">{{end}}
    <link rel="stylesheet" href="/static/css/viewer.css?v=10">
</head>
<body class="viewer-page" style="--reader-primary:{{.PrimaryColor}};--reader-background:{{.Background}}">
    {{template "public_reader" .}}
    <script>window.FLIPBOOK_DATA = {{.DataJSON}};</script>
    <script src="/static/js/viewer.js?v=10" defer></script>
</body>
</html>
{{end}}
