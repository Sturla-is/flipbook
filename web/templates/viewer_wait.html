{{define "viewer_wait"}}
<!DOCTYPE html>
<html lang="{{.Language}}" dir="{{.Direction}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Flipbook.Title}} — preparing</title>
    <link rel="icon" href="/static/img/favicon.svg">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta http-equiv="refresh" content="5">
    <link rel="stylesheet" href="/static/css/viewer.css?v=10">
</head>
<body class="wait-page{{if .Embedded}} viewer-embed{{end}}">
    <main class="wait-container">
        <div class="wait-spinner" aria-hidden="true"></div>
        <h1>{{.Flipbook.Title}}</h1>
        <p role="status">This flipbook is being prepared. The page will refresh automatically.</p>
    </main>
</body>
</html>
{{end}}
