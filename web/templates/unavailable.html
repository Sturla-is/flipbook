{{define "unavailable"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporarily Unavailable</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f13;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            max-width: 480px;
            padding: 2rem;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.6;
        }
        h1 {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 0.75rem;
        }
        p {
            color: #888;
            line-height: 1.6;
            margin-bottom: 1rem;
        }
        a {
            color: #6366f1;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">&#128218;</div>
        <h1>Temporarily Unavailable</h1>
        <p>This flipbook is currently unavailable. The owner's account
           may need attention.</p>
        <p>If you are the owner, please check your
           <a href="/plan">billing status</a> to restore access.</p>
    </div>
</body>
</html>
{{end}}
